version: "3.8"

services:
  nuuvsen-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuuvsen-app:latest
    container_name: nuuvsen-app
    restart: unless-stopped
    ports:
      - "8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
